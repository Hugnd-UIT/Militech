services:
  militech:
    image: militech:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: militech-${REPO_SLUG:-target}
    working_dir: /data
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
      - CONTAINER_NAME=militech-${REPO_SLUG:-target}
    
    volumes:
      - ${ROOT_DIR:-..}:/app:rw
      - ${HOST_OUTPUTS:-../outputs/target}:/outputs:rw
      - ${HOST_CONFIG:-../config/config.yml}:/app/config/config.yml:ro
    
    command:
      - "${TARGET:?Set TARGET=<git_url>}"
      - "--branch"
      - "${BRANCH:-}"
    restart: "no"
