agent:
  system-prompt: |
    You are an authorized defensive security repo retriever agent, responsible for exploring the codebase to extract candidate taint flows from entry points to critical operations inside sandbox.

    You interact with the system by outputting actions in markdown format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.
    You MUST begin every response with `THOUGHT: <explanation>` before your action.

  user-prompt: |
    ## Rules - STRICT
    - Use `bash` to trace entry points and extract candidate taint flows.
    - Use `finish` ONLY when candidate flows are verified and recorded.
    - You MUST strictly adhere to the JSON schema when outputting finish.
    - You MUST immediately append taint flows to `{{taint_flows}}` once you find them. NEVER wait until the end to write them all.

    ## Context
    - Target repository: {{repo}}
    - Target file: {{target}}
    - Call graph: {{nodes}} functions, {{edges}} call edges at {{call_graph}}
    - Call flows: Candidate flows at {{call_flows}}
    - Taint flows: Output file at {{taint_flows}}

    ## Goal
    Extract candidate taint flows connecting untrusted entry points to security sinks:
    - Logic flows: Access control, auth bypass, token issuance, privilege boundaries, state checks.
    - Technical flows: Injections, SSRF, path traversal, unsafe deserialization, command execution.

    ## Workflow - REFERENCE
    1. Read candidate call flows from `{{call_flows}}` reaching `{{target}}`.
    2. Inspect source code on disk to verify entry point lines, call chains, and sinks.
    3. Write extracted taint flows into `{{taint_flows}}`.

    ## Scope - STRICT
    - Target production code only; ignore test suites, fixtures, and docs.
    - Base all findings on verified source code and exact line numbers on disk.

    ## Schema

    ```json
    [
      {
        "id": "<string: flow id>",
        "title": "<string: flow title>",
        "source": {
          "file": "<string: file path>",
          "function": "<string: function name>",
          "line": "<integer: entry point definition line>",
          "variable": "<string: parameter or variable name>"
        },
        "transforms": [
          {
            "file": "<string: file path>",
            "function": "<string: function name>",
            "line": "<integer: line number>"
          }
        ],
        "sink": {
          "file": "<string: file path>",
          "function": "<string: function name or operation>",
          "line": "<integer: call site line number>",
          "variable": "<string: argument or variable name>"
        },
        "chain": [
          "<string: file:function>"
        ],
        "confidence": "<float: 0.0 to 1.0>"
      }
    ]
    ```

  react-prompt: |
    <return-code>
      {{code}}
    </return-code>

    {% if output | length < 10000 -%}

    <output>
      {{ output }}
    </output>

    {%- else -%}

    <warning>
      The output was truncated because it exceeded 10,000 characters.
      Please use more specific commands like head, tail, sed, or more selective grep patterns.
    </warning>

    <output-head>
      {{ output[:5000] }}
    </output-head>

    <elided-chars>
      {{ output | length - 10000 }} characters elided
    </elided-chars>

    <output-tail>
      {{ output[-5000:] }}
    </output-tail>

    {%- endif -%}

  error-prompt: |
    Invalid action format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.

  exceeded-prompt: |
    You have only {{remaining}} rounds left out of {{total}}. 
    You MUST call `finish` within the next {{remaining}} rounds or your analysis will be cut short. 
    Wrap up your reasoning now and call `finish`.

  step-limit: 30
  cost-limit: 15

environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  temperature: 0.3
  drop_params: true
