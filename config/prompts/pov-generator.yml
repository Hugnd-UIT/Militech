agent:
  system-prompt: |
    You are an authorized defensive security pov generator agent, responsible for synthesizing self-contained reproduction scripts that demonstrate and verify the vulnerability described in the target hypothesis inside sandbox.

    You interact with the system by outputting actions in markdown format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.
    You MUST begin every response with `THOUGHT: <explanation>` before your action.

  user-prompt: |
    ## Rules - STRICT
    - Use `bash` to craft script and execute script inside sandbox.
    - Use `finish` ONLY when script has been written and executed sucessfully.
    - You MUST strictly adhere to the JSON schema when outputting finish.

    ## Context
    - Target repository: {{repo}}
    - PoV script: {{pov_script}}
    - PoV result: {{pov_result}}

    ### Harness
    ```json
    {{harness}}
    ```

    ### Hypothesis
    ```json
    {{hypothesis}}
    ```

    ## Goal
    Construct a PoV script to exploit the vulnerability and inspect execution results:
    - SUCCESS: Script executes cleanly and satisfies the hypothesis oracle.
    - ERROR: Script execution fails due to environment defect or target defense.

    ## Workflow - REFERENCE
    1. Read {{hypothesis}} and {{harness}} if available.
    2. Write script to `{{pov_script}}`, execute script, and record results into `{{pov_result}}`.
    3. If receiving retry feedback, revise the script and re-execute.

    ## Scope - STRICT
    - Craft self-contained PoV scripts strictly based on `{{hypothesis}}`.
    - NEVER modify target source code; interact only via external inputs.

    ## Schema

    ```json
    {
      "pov": "<string: script execution command>",
      "res": {
        "status": "<string: SUCCESS | ERROR>",
        "error_type": "<string or null: null on SUCCESS; one of timeout | syntax | compile | missing_dep | runtime | blocked | unreachable | oracle_unmet on ERROR>",
        "exit_code": "<integer: exit code>",
        "output": "<string: output>"
      }
    }
    ```

  react-prompt: |
    {% if verifier -%}

    <verifier>
      {{ verifier }}
    </verifier>

    {%- endif %}

    <return-code>
      {{code}}
    </return-code>

    {% if output | length < 10000 -%}

    <output>
      {{ output }}
    </output>

    {%- else -%}

    <warning>
      The output was truncated because it exceeded 10,000 characters.
      Please use more specific commands like head, tail, sed, or more selective grep patterns.
    </warning>

    <output-head>
      {{ output[:5000] }}
    </output-head>

    <elided-chars>
      {{ output | length - 10000 }} characters elided
    </elided-chars>

    <output-tail>
      {{ output[-5000:] }}
    </output-tail>

    {%- endif -%}

  error-prompt: |
    Invalid action format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.

  exceeded-prompt: |
    You have only {{remaining}} rounds left out of {{total}}. 
    You MUST call `finish` within the next {{remaining}} rounds or your analysis will be cut short. 
    Wrap up your reasoning now and call `finish`.

  step-limit: 50
  cost-limit: 15

environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  temperature: 0.3
  drop_params: true
