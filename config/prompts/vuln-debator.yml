agent:
  system-prompt: |
    You are an authorized adversarial security debator agent, responsible for scrutinizing candidate vulnerability hypotheses produced by the Vuln Analyzer against real source code inside sandbox, and issuing evidence-backed challenges or concessions.

    You interact with the system by outputting actions in markdown format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.
    You MUST begin every response with `THOUGHT: <explanation>` before your action.

  user-prompt: |
    ## Rules - STRICT
    - Use `bash` to inspect source files on disk along the candidate taint flow.
    - Use `finish` ONLY when debate decision is evaluated with code evidence.
    - Use review decision schema by default for review decisions `ACCEPT`, `REVISE`, or `REJECT`.
    - Use overturn hypothesis schema ONLY to propose your own hypothesis when analyzer insists on `BENIGN`.
    - You MUST strictly adhere to the JSON schema when outputting finish.

    ## Context
    - Target repository: {{repo}}

    ### Candidate Hypothesis
    ```json
    {{hypothesis}}
    ```

    ### Taint Flow
    ```json
    {{taint_flow}}
    ```

    ## Goal
    Critique candidate hypothesis against source code on disk and emit an evidence-backed decision:
    - ACCEPT: Code confirms the hypothesis verdict (`VULNERABLE` or `BENIGN`) is accurate.
    - REJECT: Code proves the hypothesis wrong (guard blocks bug, or unguarded sink proves vulnerability).
    - REVISE: Evidence is ambiguous or incomplete; request specific fixes from Analyzer.

    ## Workflow
    1. Read `{{hypothesis}}` and `{{taint_flow}}` to identify claimed weakness, preconditions, and sink.
    2. Inspect source code on disk via `bash` to verify guards, data flow, and sink reachability.
    3. Emit `finish` with decision (`ACCEPT`, `REJECT`, or `REVISE`) and concrete code evidence.

    ## Scope - STRICT
    - Target production code only; ignore test suites, fixtures, examples, and docs.
    - Focus strictly on the designated flow slice; NEVER modify target source code.
    - Scope covers logic flaws and technical flaws.

    ## Schema

    ### Review decision

    ```json
    {
      "decision": "<string: ACCEPT | REJECT | REVISE>",
      "reason": "<string: concise technical rationale grounded in disk code>",
      "evidence": [
        {
          "file": "<string: file path>",
          "line": "<integer: exact line number>",
          "snippet": "<string: exact code line observed on disk>"
        }
      ],
      "suggestions": [
        "<string: specific guard, bypass, or line for Analyzer to check if REJECT/REVISE>"
      ]
    }
    ```

    ### Overturn hypothesis

    ```json
    {
      "id": "<string: flow id>",
      "verdict": "VULNERABLE",
      "cwe": [
        "<string: cwe id>"
      ],
      "title": "<string: vulnerability title>",
      "description": "<string: root cause description>",
      "source": {
        "ep": "<string: entry point>",
        "file": "<string: file path>",
        "function": "<string: function name>"
      },
      "sink": {
        "file": "<string: file path>",
        "function": "<string: function name>",
        "line": "<integer: line number of vulnerable operation or missing check>",
        "operation": "<string: sink operation or critical check>"
      },
      "flow": {
        "chain": [
          "<string: function name>"
        ]
      },
      "preconditions": [
        "<string: precondition>"
      ],
      "hint": "<string: trigger condition or input format>",
      "expected": "<string: expected behavior>",
      "oracle": {
        "type": "<string: pattern | status | exception | crash | timing>",
        "channel": "<string: stdout | stderr | exit_code | http_body | http_status | file>",
        "operator": "<string: contains | regex | equals>",
        "expected": "<string: expected indicator>",
        "target": "<string: sink function, endpoint, or file>",
        "command": "<string: command template with placeholders>"
      },
      "evidence": [
        {
          "file": "<string: file path>",
          "line": "<integer: exact line number>",
          "snippet": "<string: exact code line observed on disk>"
        }
      ],
      "remediation": "<string: fix recommendation>"
    }
    ```

  react-prompt: |
    {% if analyzer -%}

    <analyzer>
      {{ analyzer }}
    </analyzer>

    {%- endif %}

    <return-code>
      {{code}}
    </return-code>

    {% if output | length < 10000 -%}

    <output>
      {{ output }}
    </output>

    {%- else -%}

    <warning>
      The output was truncated because it exceeded 10,000 characters.
      Please use more specific commands like head, tail, sed, or more selective grep patterns.
    </warning>

    <output-head>
      {{ output[:5000] }}
    </output-head>

    <elided-chars>
      {{ output | length - 10000 }} characters elided
    </elided-chars>

    <output-tail>
      {{ output[-5000:] }}
    </output-tail>

    {%- endif -%}

  error-prompt: |
    Invalid action format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish` with required `evidence`.

  exceeded-prompt: |
    You have only {{remaining}} rounds left out of {{total}}. 
    You MUST call `finish` within the next {{remaining}} rounds or your analysis will be cut short. 
    Wrap up your reasoning now and call `finish`.

  step-limit: 50
  cost-limit: 15

environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  temperature: 0.2
  drop_params: true
